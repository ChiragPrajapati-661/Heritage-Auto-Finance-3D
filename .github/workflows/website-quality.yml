name: Website Quality Checks

on:
  push:
    branches:
      - main
      - "sync/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "sync/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install temporary Playwright renderer
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: Prerender public routes
        run: npm run prerender

      - name: Verify prerendered routes and SEO files
        run: |
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/services/new-car-finance/index.html
          test -s dist/services/used-car-finance/index.html
          test -s dist/services/car-refinance/index.html
          test -s dist/services/commercial-vehicle-finance/index.html
          test -s dist/services/insurance-assistance/index.html
          test -s dist/emi-calculator/index.html
          test -s dist/about/index.html
          test -s dist/contact/index.html
          test -s dist/privacy-policy/index.html
          test -s dist/terms-and-conditions/index.html
          cp dist/index.html dist/404.html
          test -s dist/404.html
          echo "All public routes have prerendered HTML."
